<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Slider Loop</title>

  <!-- Swiper CSS (Slider bibliotek) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      font-family: Arial, sans-serif;
    }

    /* Container til hele slideren */
    .swiper {
      width: 100%;
      height: 100vh; /* Fyld hele skærmens højde - tilpas efter behov */
    }

    .swiper-slide {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Standard style for alle slider-videoer */
    .slider-video {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Sørger for at videoen fylder hele slidet ud */
      display: block;
    }

    /* SPECIFIK CROP TIL VIDEO 2 (Paraplyen) */
    .crop-umbrella {
      object-fit: cover;
      /*
        Brug transform: scale(...) for at zoome ind på paraplyen.
        2.0 svarer til 200% zoom. Tilpas tallet hvis du skal tættere på eller længere væk.
      */
      transform: scale(2.0);
      /* Skift center-fokus hvis paraplyen ikke sidder midt i billedet (f.eks. 50% 30%) */
      transform-origin: center center;
    }

    /* Styling af knapper og navigation */
    .swiper-button-next,
    .swiper-button-prev {
      color: #ffffff;
    }

    .swiper-pagination-bullet-active {
      background: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Swiper Slider Container -->
  <div class="swiper videoSlider">
    <div class="swiper-wrapper">

      <!-- SLIDE 1: Første del af video 1 -->
      <div class="swiper-slide">
        <video class="slider-video" autoplay loop muted playsinline preload="auto">
          <source src="video1_del1.mp4" type="video/mp4">
          Din browser understøtter ikke video-tagget.
        </video>
      </div>

      <!-- SLIDE 2: Anden del af video 1 -->
      <div class="swiper-slide">
        <video class="slider-video" autoplay loop muted playsinline preload="auto">
          <source src="video1_del2.mp4" type="video/mp4">
          Din browser understøtter ikke video-tagget.
        </video>
      </div>

      <!-- SLIDE 3: Video 2 (Beskåret / Zoomet på paraplyen) -->
      <div class="swiper-slide">
        <video class="slider-video crop-umbrella" autoplay loop muted playsinline preload="auto">
          <source src="paraply_video.mp4" type="video/mp4">
          Din browser understøtter ikke video-tagget.
        </video>
      </div>

    </div>

    <!-- Pile til navigation -->
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>

    <!-- Prikker i bunden (Pagination) -->
    <div class="swiper-pagination"></div>
  </div>

  <!-- Swiper JS (Slider bibliotek) -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <!-- JavaScript aktivering og konfiguration -->
  <script>
    const swiper = new Swiper('.videoSlider', {
      // Loop-mode (Kører uendeligt igennem slidene ligesom på guldsmed index)
      loop: true,
      
      // Sørg for jævn overgang
      speed: 800,

      // Navigation med pile
      navigation: {
        nextEl: '.swiper-button-next',
        prevEl: '.swiper-button-prev',
      },

      // Prikker i bunden
      pagination: {
        el: '.swiper-pagination',
        clickable: true,
      },

      // Autoplay: Skifter automatisk slide efter x antal millisekunder (f.eks. 6000ms = 6 sekunder)
      autoplay: {
        delay: 6000,
        disableOnInteraction: false,
      },

      // Genstart altid videoen forfra, når en slide bliver aktiv
      on: {
        slideChangeTransitionStart: function () {
          const activeVideos = document.querySelectorAll('.swiper-slide-active video');
          activeVideos.forEach(video => {
            video.currentTime = 0;
            video.play();
          });
        }
      }
    });
  </script>

</body>
</html>
